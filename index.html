lectionMode?'flex':'none';}if (sBtn) sBtn.textContent=this.isSelectionMode?'선택 취소':'☑️ 선택';if (!this.isSelectionMode) this.selectedMessageIds.clear();this.updateSelectionToolbar();}onMessageSelectToggle(msgId,checked){checked?this.selectedMessageIds.add(msgId):this.selectedMessageIds.delete(msgId);this.ui.setRowChecked(msgId,checked);this.updateSelectionToolbar();}selectAllMessages(checked){this.selectedMessageIds.clear();if (checked) this.messages.forEach(m=>this.selectedMessageIds.add(m.id));this.messages.forEach(m=>this.ui.setRowChecked(m.id,checked));this.updateSelectionToolbar();}updateSelectionToolbar(){const txt=document.getElementById('selected-count-text');const btn=document.getElementById('delete-selected-btn');const all=document.getElementById('select-all-btn');if (txt) txt.textContent=`${this.selectedMessageIds.size}개 선택됨`;if (btn){btn.disabled=!this.selectedMessageIds.size;btn.textContent=`선택 삭제 (${this.selectedMessageIds.size})`;}if (all) all.textContent=this.messages.length&&this.selectedMessageIds.size===this.messages.length?'선택 해제':'전체 선택';}async runConcurrently(tasks,concurrency=3){const results=[];const executing=[];for (const task of tasks){const p=Promise.resolve().then(()=>task());results.push(p);const e=p.finally(()=>{const idx=executing.indexOf(e);if (idx!==-1) executing.splice(idx,1);});executing.push(e);if (executing.length>=concurrency) await Promise.race(executing);}return Promise.all(results);}async deleteSelectedMessages(idsToDelete){if (!this.githubClient) return false;const ids=idsToDelete||Array.from(this.selectedMessageIds);if (!ids.length) return false;const ok=await this.ui.showModal({title:"선택 항목 삭제",bodyHtml:`<p>선택한 <strong>${ids.length}</strong>개 항목을 영구 삭제하시겠습니까?</p>`,confirmText:"삭제",showCancel:true});if (!ok) return false;this.ui.updateConnectionStatus('connecting','삭제 중...');let done=0;const tasks=ids.map(id=>async ()=>{const msg=this.messages.find(m=>m.id===id);try{if (msg?.assetPath) await this.githubClient.deleteAsset(msg.assetPath);if (msg?.commentId) await this.githubClient.deleteComment(msg.commentId);done++;this.ui.removeMessage(id);this.selectedMessageIds.delete(id);const idx=this.messages.findIndex(m=>m.id===id);if (idx!==-1) this.messages.splice(idx,1);if (msg?.assetPath&&this.mediaCache.has(msg.assetPath)){URL.revokeObjectURL(this.mediaCache.get(msg.assetPath));this.mediaCache.delete(msg.assetPath);}}catch (e){}});await this.runConcurrently(tasks,3);this.ui.updateConnectionStatus('connected','연결됨');this.updateAttachmentsBadge();this.updateSelectionToolbar();this.ui.showToast(`${done}개 항목이 삭제되었습니다.`);if (!this.selectedMessageIds.size&&this.isSelectionMode) this.toggleSelectionMode(false);return true;}async deleteAllMessages(){if (!this.githubClient) return false;const ok=await this.ui.showModal({title:"전체 삭제 (대화방 비우기)",bodyHtml:`<p style="color:var(--danger);font-weight:600;">주의:모든 메시지와 첨부 파일이 영구 삭제됩니다.</p>`,confirmText:"전체 영구 삭제",showCancel:true});if (!ok) return false;this.ui.updateConnectionStatus('connecting','전체 삭제 중...');try{const assetTasks=this.messages.filter(m=>m.assetPath).map(m=>()=>this.githubClient.deleteAsset(m.assetPath).catch(()=>{}));const{comments}=await this.githubClient.fetchComments();const commentTasks=comments.map(c=>()=>this.githubClient.deleteComment(c.id).catch(()=>{}));await this.runConcurrently([...assetTasks,...commentTasks],3);this.messages=[];this.selectedMessageIds.clear();this.lastSyncTimestamp=null;if (this.ui.messagesContainer) this.ui.messagesContainer.innerHTML='';this.ui.renderedIds.clear();this.mediaCache.forEach(u=>URL.revokeObjectURL(u));this.mediaCache.clear();if (this.isSelectionMode) this.toggleSelectionMode(false);this.updateAttachmentsBadge();this.ui.updateConnectionStatus('connected','연결됨');this.ui.showToast("대화방이 초기화되었습니다.");return true;}catch (e){this.ui.updateConnectionStatus('error','삭제 실패');alert(`전체 삭제 실패:${e.message}`);return false;}}openAttachmentsModal(){const atts=this.messages.filter(m=>['image','file','audio'].includes(m.type));for (const a of atts){const ref=a.assetPath||a.vaultPath||a.assetId;if (!a.content&&ref&&this.mediaCache.has(ref)){a.content=this.mediaCache.get(ref);}}this.ui.showAttachmentsModal({attachments:[...atts],onDeleteSelected:(ids)=>this.deleteSelectedMessages(ids),onDeleteAll:()=>this.deleteAllMessages(),onDownload:async (att)=>{const ref=att.assetPath||att.vaultPath||att.assetId;const name=att.metadata?.fileName||(att.type==='audio'?'voice.webm':'download.bin');try{const url=ref?await this.ui.loadAssetFile(ref,att.metadata?.mimeType):att.content;att.content=url;if (att.type==='image') return this.ui.showImageLightbox(url);const a=document.createElement('a');a.href=url;a.download=name;a.click();}catch (e){alert(`다운로드 실패:${e.message}`);}},onLightbox:(src)=>this.ui.showImageLightbox(src)});}openSettingsModal(){const bodyHtml=`
